<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders — Timeline Feed | Befach</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent: #f97316;
    --accent-light: #fff7ed;
    --bg: #f9fafb;
    --card-bg: #ffffff;
    --text-primary: #111827;
    --text-secondary: #4b5563;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --radius: 10px;
  }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    font-weight: 400;
    font-size: 14px;
    line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
  }

  .page {
    max-width: 1400px;
    margin: 0 auto;
    padding: 28px 32px;
    padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
  }

  /* ── Header ── */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .page-header h1 {
    font-size: 1.35rem;
    font-weight: 600;
    color: var(--text-primary);
  }
  .page-header p {
    font-size: 0.82rem;
    color: var(--text-secondary);
    margin-top: 2px;
    font-weight: 400;
  }
  .header-actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    border: none;
    font-family: inherit;
    min-height: 38px;
  }
  .btn-primary {
    background: var(--accent);
    color: white;
  }
  .btn-primary:hover { opacity: 0.9; }
  .btn-ghost {
    background: var(--card-bg);
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover {
    border-color: #d1d5db;
  }

  /* ── Stats Strip ── */
  .stats-strip {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }
  .stat-card.active {
    border-color: var(--accent);
    background: var(--accent-light);
  }

  .stat-icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: var(--accent-light);
    color: var(--accent);
  }
  .stat-text { display: flex; flex-direction: column; gap: 1px; }
  .stat-text .value {
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--text-primary);
  }
  .stat-text .label {
    font-size: 0.68rem;
    font-weight: 400;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .stat-text .trend {
    font-size: 0.68rem;
    color: var(--text-secondary);
    font-weight: 400;
  }

  /* ── Filter Bar ── */
  .filter-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .filter-chips {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    flex: 1;
    min-width: 0;
  }
  .filter-chips::-webkit-scrollbar { display: none; }

  .filter-chip {
    flex-shrink: 0;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 0.78rem;
    font-weight: 400;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text-secondary);
    white-space: nowrap;
    font-family: inherit;
  }
  .filter-chip:hover {
    border-color: #d1d5db;
  }
  .filter-chip.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .chip-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 4px;
    font-size: 0.66rem;
    font-weight: 500;
    margin-left: 5px;
    background: rgba(0,0,0,0.06);
  }
  .filter-chip.active .chip-count {
    background: rgba(255,255,255,0.25);
    color: white;
  }

  /* ── Search ── */
  .search-wrapper {
    position: relative;
    flex-shrink: 0;
    width: 240px;
  }
  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
  }
  .search-input {
    width: 100%;
    padding: 7px 32px 7px 34px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.8rem;
    font-weight: 400;
    outline: none;
    background: var(--card-bg);
    color: var(--text-primary);
    font-family: inherit;
  }
  .search-input:focus {
    border-color: var(--accent);
  }
  .search-input::placeholder { color: var(--text-muted); }
  .search-clear {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: none;
    background: var(--border);
    color: var(--text-secondary);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 0.6rem;
    padding: 0;
    font-family: inherit;
  }
  .search-clear.visible { display: flex; }

  /* ── Timeline Container ── */
  #timelineContainer { min-height: 200px; }

  /* ── Date Group ── */
  .date-group { margin-bottom: 24px; }
  .date-label {
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 12px;
  }

  /* ── Timeline ── */
  .timeline {
    position: relative;
  }

  .timeline-item {
    position: relative;
    margin-bottom: 12px;
  }
  .timeline-item:last-child { margin-bottom: 0; }

  /* ── Order Card ── */
  .tl-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    cursor: pointer;
    position: relative;
  }
  .tl-card:hover {
    border-color: #d1d5db;
  }

  .tl-card.expanded {
    border-color: var(--accent);
  }

  .tl-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    gap: 8px;
  }
  .tl-card-header-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tl-card-id {
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--accent);
  }
  .tl-card-badge {
    font-size: 0.66rem;
    font-weight: 500;
    padding: 3px 8px;
    border-radius: 4px;
    background: var(--accent-light);
    color: var(--accent);
  }
  .tl-card-badge.delivered {
    background: #f3f4f6;
    color: var(--text-muted);
  }

  .tl-card-expand-icon {
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    flex-shrink: 0;
  }
  .tl-card.expanded .tl-card-expand-icon {
    transform: rotate(90deg);
    color: var(--accent);
  }

  .tl-card-product {
    font-size: 0.88rem;
    font-weight: 500;
    color: var(--text-primary);
    margin-bottom: 2px;
  }
  .tl-card-supplier {
    font-size: 0.76rem;
    color: var(--text-secondary);
    margin-bottom: 12px;
    font-weight: 400;
  }

  /* ── Progress Stepper ── */
  .progress-stepper {
    display: flex;
    align-items: center;
    margin-bottom: 12px;
    padding: 10px 14px;
    background: var(--bg);
    border-radius: 8px;
  }
  .step {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
  }
  .step-dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e5e7eb;
    color: white;
    z-index: 2;
    font-size: 0.58rem;
    font-weight: 500;
  }
  .step-dot.active {
    background: var(--accent);
  }
  .step-dot.done {
    background: var(--accent);
    opacity: 0.6;
  }
  .step-label {
    font-size: 0.6rem;
    font-weight: 400;
    color: var(--text-secondary);
    text-align: center;
    white-space: nowrap;
  }
  .step-label.active { color: var(--accent); font-weight: 500; }
  .step-label.done { color: var(--text-secondary); }

  .step-line {
    flex: 1;
    height: 1px;
    background: #e5e7eb;
    margin: 0 4px;
    align-self: flex-start;
    margin-top: 11px;
    min-width: 14px;
  }
  .step-line.done { background: var(--accent); opacity: 0.4; }
  .step-line.active { background: var(--accent); opacity: 0.6; }

  /* ── Card Meta ── */
  .tl-card-meta {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .tl-meta-item { display: flex; flex-direction: column; gap: 1px; }
  .tl-meta-label {
    font-size: 0.64rem;
    font-weight: 400;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .tl-meta-value {
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text-primary);
  }
  .tl-meta-value.highlight { color: var(--accent); }

  /* ── Mobile-only elements (hidden on desktop) ── */
  .tl-card-mobile-meta { display: none; }
  .tl-mobile-detail { display: none; }
  .tl-card-mobile-value { display: none; }

  /* ── Expandable Details ── */
  .tl-card-details {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    margin-top: 0;
  }
  .tl-card.expanded .tl-card-details {
    max-height: 400px;
    opacity: 1;
    margin-top: 14px;
  }

  .detail-status-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-radius: 8px;
    margin-bottom: 14px;
    background: var(--accent-light);
  }
  .detail-status-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: var(--accent);
    color: white;
  }
  .detail-status-text { display: flex; flex-direction: column; gap: 1px; }
  .detail-status-text strong {
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--accent);
  }
  .detail-status-text span {
    font-size: 0.72rem;
    font-weight: 400;
    color: var(--text-secondary);
  }

  .detail-extra-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }
  .detail-extra-item { display: flex; flex-direction: column; gap: 2px; }
  .detail-extra-label {
    font-size: 0.64rem;
    font-weight: 400;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .detail-extra-value {
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text-primary);
  }

  .detail-actions {
    display: flex;
    gap: 8px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .detail-actions .btn {
    flex: 1;
    justify-content: center;
    font-size: 0.78rem;
    padding: 8px 12px;
    min-height: 42px;
  }

  /* ── Empty State ── */
  .empty-state {
    text-align: center;
    padding: 48px 24px;
  }
  .empty-state-icon {
    width: 48px;
    height: 48px;
    border-radius: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 14px;
    color: var(--text-muted);
  }
  .empty-state h4 {
    font-size: 0.88rem;
    font-weight: 500;
    margin-bottom: 4px;
  }
  .empty-state p {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-weight: 400;
    margin-bottom: 14px;
  }
  .empty-state .btn { margin: 0 auto; }

  /* ── Modal ── */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .modal-backdrop.open { display: flex; }

  .modal-card {
    background: var(--card-bg);
    border-radius: 12px;
    width: calc(100% - 32px);
    max-width: 480px;
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
  }
  .modal-header h3 {
    font-size: 0.95rem;
    font-weight: 600;
  }
  .modal-close {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: none;
    background: var(--bg);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
  }
  .modal-close:hover { background: var(--border); }

  .modal-body { padding: 20px; }
  .form-group { margin-bottom: 14px; }
  .form-group:last-child { margin-bottom: 0; }
  .form-label {
    display: block;
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 5px;
  }
  .form-input {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.82rem;
    font-weight: 400;
    outline: none;
    background: var(--card-bg);
    color: var(--text-primary);
    font-family: inherit;
  }
  .form-input:focus { border-color: var(--accent); }
  .form-input::placeholder { color: var(--text-muted); }
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .modal-footer {
    display: flex;
    gap: 8px;
    padding: 14px 20px 20px;
  }
  .modal-footer .btn { flex: 1; justify-content: center; }

  /* ── Toast ── */
  .toast {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--text-primary);
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 0.8rem;
    font-weight: 400;
    z-index: 2000;
    white-space: nowrap;
    display: none;
    align-items: center;
    gap: 8px;
  }
  .toast.visible {
    display: flex;
  }
  .toast-icon {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  /* ── Mobile Bottom Sheet ── */
  .sheet-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 1100;
  }
  .sheet-backdrop.open { display: block; }

  .bottom-sheet {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--card-bg);
    border-radius: 14px 14px 0 0;
    max-height: 85vh;
    overflow-y: auto;
    z-index: 1200;
    padding: 0 20px 24px;
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .bottom-sheet.open { display: block; }
  .sheet-handle {
    width: 36px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 10px auto 16px;
  }
  .bottom-sheet .detail-extra-grid {
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }
  .bottom-sheet .detail-extra-label { font-size: 0.66rem; }
  .bottom-sheet .detail-extra-value { font-size: 0.82rem; }
  .bottom-sheet .detail-actions { padding-top: 14px; }
  .bottom-sheet .detail-actions .btn {
    min-height: 44px;
    font-size: 0.82rem;
  }
  .bottom-sheet .detail-status-banner {
    padding: 12px;
    margin-bottom: 16px;
  }

  /* ── Mobile (≤768px) ── */
  @media (max-width: 768px) {
    body { background: #ffffff; overflow-x: hidden; }

    .page {
      width: 100%;
      max-width: 100%;
      padding: 0;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* Header */
    .page-header {
      padding: 14px 12px;
      margin-bottom: 0;
      gap: 8px;
      flex-wrap: nowrap;
    }
    .page-header h1 { font-size: 1.25rem; }
    .page-header p { display: none; }
    .header-actions .btn-ghost { display: none; }
    .header-actions { flex-shrink: 0; }
    .header-actions .btn-primary {
      padding: 7px 14px;
      font-size: 0.8rem;
      min-height: 34px;
      border-radius: 20px;
    }

    /* Stats: horizontal strip, no card borders, dividers between */
    .stats-strip {
      display: flex;
      gap: 0;
      margin-bottom: 0;
      border-bottom: 1px solid #f0f0f0;
      padding: 10px 0;
    }
    .stat-card {
      flex: 1;
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 6px 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      border-right: 1px solid #efefef;
    }
    .stat-card:last-child { border-right: none; }
    .stat-card.active {
      background: transparent;
      border-color: #efefef;
    }
    .stat-card.active .stat-text .value { color: var(--accent); }
    .stat-icon { display: none; }
    .stat-text { align-items: center; }
    .stat-text .value { font-size: 1.15rem; }
    .stat-text .label { font-size: 0.64rem; }
    .stat-text .trend { display: none; }

    /* Filter bar: sticky, clean */
    .filter-bar {
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 10;
      background: #ffffff;
      padding: 10px 12px;
      margin: 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .search-wrapper { width: 100%; }
    .search-input {
      min-height: 40px;
      font-size: 0.88rem;
      border-radius: 10px;
      background: #f3f4f6;
      border: 1px solid transparent;
      padding: 8px 32px 8px 34px;
    }
    .search-input:focus {
      border-color: var(--accent);
      background: #ffffff;
    }
    .filter-chip {
      padding: 7px 10px;
      font-size: 0.82rem;
      min-height: 34px;
      border-radius: 20px;
      flex-grow: 1;
      text-align: center;
    }
    .filter-chip[data-status="delivered"] { display: none; }
    .chip-count {
      min-width: 18px;
      height: 18px;
      font-size: 0.64rem;
      margin-left: 4px;
      border-radius: 9px;
    }

    /* Timeline: edge-to-edge list */
    #timelineContainer { padding: 0; }
    .date-group { margin-bottom: 0; }
    .date-label {
      font-size: 0.7rem;
      margin-bottom: 0;
      padding: 10px 12px 6px;
      color: var(--text-muted);
      background: #fafafa;
      letter-spacing: 0.06em;
    }
    .timeline-item { margin-bottom: 0; }

    /* Cards → list items with hairline dividers */
    .tl-card {
      background: transparent;
      border: none;
      border-bottom: 1px solid #f0f0f0;
      border-radius: 0;
      padding: 14px 12px;
    }
    .tl-card:hover { border-color: #f0f0f0; }
    .tl-card.expanded { border-color: #f0f0f0; }
    .tl-card:active { background: #fafafa; }

    .tl-card-header { margin-bottom: 5px; justify-content: flex-start; }
    .tl-card-id { font-size: 0.76rem; }
    .tl-card-badge {
      font-size: 0.68rem;
      padding: 3px 10px;
      border-radius: 10px;
    }

    /* Card body: content left, value right */
    .tl-card-body {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .tl-card-body-left { flex: 1; min-width: 0; }
    .tl-card-product {
      font-size: 1rem;
      font-weight: 500;
      margin-bottom: 2px;
    }
    .tl-card-supplier {
      font-size: 0.84rem;
      margin-bottom: 0;
    }
    .tl-card-mobile-value {
      display: block;
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--accent);
      flex-shrink: 0;
      white-space: nowrap;
      padding-top: 1px;
      margin-left: auto;
    }

    .tl-card-expand-icon {
      display: flex;
      width: 18px;
      height: 18px;
      color: #d1d5db;
      margin-left: auto;
    }

    /* Hide stepper on cards, show in bottom sheet */
    .tl-card .progress-stepper { display: none; }
    .bottom-sheet .progress-stepper { display: flex; }

    /* Hide desktop meta grid */
    .tl-card-meta { display: none; }

    /* Mobile meta: date + route under product/supplier */
    .tl-card-mobile-meta {
      display: block;
      margin-top: 6px;
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.4;
    }
    /* Hide old spans */
    .tl-mobile-value,
    .tl-mobile-detail,
    .tl-mobile-sep,
    .tl-mobile-info { display: none; }

    /* Hide desktop expand details */
    .tl-card-details { display: none !important; }

    /* Modal: full-screen on mobile */
    .modal-card {
      width: 100%;
      max-width: 100%;
      max-height: 100vh;
      border-radius: 0;
      height: 100vh;
    }
    .modal-header { padding: 14px 12px; }
    .modal-header h3 { font-size: 1.05rem; }
    .modal-body { padding: 14px 12px; }
    .modal-footer { padding: 12px; }
    .form-input {
      min-height: 46px;
      font-size: 0.9rem;
      padding: 10px 14px;
      border-radius: 10px;
    }
    .form-label { font-size: 0.8rem; margin-bottom: 6px; }
    .form-row { gap: 10px; }
    .modal-footer .btn {
      min-height: 46px;
      border-radius: 10px;
      font-size: 0.88rem;
    }

    /* Bottom sheet */
    .bottom-sheet { padding: 0 12px 20px; }
    .bottom-sheet .detail-extra-label { font-size: 0.72rem; }
    .bottom-sheet .detail-extra-value { font-size: 0.88rem; }
    .bottom-sheet .detail-actions .btn { font-size: 0.88rem; }

    /* Empty state */
    .empty-state { padding: 40px 12px; }
    .empty-state h4 { font-size: 0.95rem; }
    .empty-state p { font-size: 0.86rem; }
  }

  /* ── Small phones (≤400px) ── */
  @media (max-width: 400px) {
    .page-header { padding: 12px 10px; }
    .page-header h1 { font-size: 1.15rem; }
    .header-actions .btn-primary { padding: 6px 12px; font-size: 0.78rem; }

    .stat-card { padding: 4px 0; }
    .stat-text .value { font-size: 1.05rem; }
    .stat-text .label { font-size: 0.58rem; }

    .filter-bar { padding: 8px 10px; }
    .filter-chip { padding: 6px 6px; font-size: 0.76rem; min-height: 32px; }
    .search-input { min-height: 38px; font-size: 0.84rem; }

    .tl-card { padding: 12px 10px; }
    .tl-card-product { font-size: 0.95rem; }
    .tl-card-supplier { font-size: 0.8rem; }
    .tl-card-mobile-meta { font-size: 0.78rem; margin-top: 5px; }
    .tl-card-mobile-value { font-size: 0.9rem; }

    .date-label { padding: 8px 10px 5px; font-size: 0.66rem; }

    .bottom-sheet { padding: 0 10px 16px; }
    .form-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="page">
    <!-- Header -->
    <div class="page-header">
      <div>
        <h1>My Orders</h1>
        <p>View and manage all your import orders</p>
      </div>
      <div class="header-actions">
        <button class="btn btn-ghost" onclick="alert('Export coming soon')">Export</button>
        <button class="btn btn-primary" onclick="openModal()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Order
        </button>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-strip">
      <div class="stat-card active" data-filter="all" onclick="filterFromStat('all')">
        <div class="stat-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a4 4 0 0 0-8 0v2"/></svg>
        </div>
        <div class="stat-text">
          <span class="value">1,847</span>
          <span class="label">Total Orders</span>
          <span class="trend">+124 this month</span>
        </div>
      </div>
      <div class="stat-card" data-filter="in_progress" onclick="filterFromStat('in_progress')">
        <div class="stat-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <div class="stat-text">
          <span class="value">342</span>
          <span class="label">In Progress</span>
          <span class="trend">28 active now</span>
        </div>
      </div>
      <div class="stat-card" data-filter="delivered" onclick="filterFromStat('delivered')">
        <div class="stat-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="stat-text">
          <span class="value">1,476</span>
          <span class="label">Completed</span>
          <span class="trend">98% on time</span>
        </div>
      </div>
      <div class="stat-card" data-filter="value" onclick="filterFromStat('all')">
        <div class="stat-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </div>
        <div class="stat-text">
          <span class="value">$2.4M</span>
          <span class="label">Total Value</span>
          <span class="trend">+23% this year</span>
        </div>
      </div>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
      <div class="filter-chips" id="filterChips">
        <button class="filter-chip active" data-status="all" onclick="setFilter('all', this)">All <span class="chip-count" id="countAll">6</span></button>
        <button class="filter-chip" data-status="processing" onclick="setFilter('processing', this)">Processing <span class="chip-count" id="countProcessing">1</span></button>
        <button class="filter-chip" data-status="transit" onclick="setFilter('transit', this)">In Transit <span class="chip-count" id="countTransit">2</span></button>
        <button class="filter-chip" data-status="customs" onclick="setFilter('customs', this)">Customs <span class="chip-count" id="countCustoms">1</span></button>
        <button class="filter-chip" data-status="delivered" onclick="setFilter('delivered', this)">Delivered <span class="chip-count" id="countDelivered">2</span></button>
      </div>
      <div class="search-wrapper">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-input" type="text" placeholder="Search orders..." id="searchInput" oninput="onSearch()">
        <button class="search-clear" id="searchClear" onclick="clearSearch()">&times;</button>
      </div>
    </div>

    <!-- Timeline -->
    <div id="timelineContainer"></div>
  </div>

  <!-- Create Order Modal -->
  <div class="modal-backdrop" id="modalBackdrop" onclick="closeModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3>Create New Order</h3>
        <button class="modal-close" onclick="closeModal()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Product Name</label>
          <input class="form-input" type="text" placeholder="e.g. USB-C Cables" id="formProduct">
        </div>
        <div class="form-group">
          <label class="form-label">Supplier</label>
          <input class="form-input" type="text" placeholder="e.g. Shenzhen Electronics Co." id="formSupplier">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Quantity</label>
            <input class="form-input" type="text" placeholder="e.g. 500 pcs" id="formQty">
          </div>
          <div class="form-group">
            <label class="form-label">Estimated Value</label>
            <input class="form-input" type="text" placeholder="e.g. $2,500" id="formValue">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Expected Delivery</label>
          <input class="form-input" type="date" id="formDate">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="createOrder()">Create Order</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast">
    <div class="toast-icon">
      <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <span id="toastText">Order created</span>
  </div>

  <!-- Mobile Bottom Sheet -->
  <div class="sheet-backdrop" id="sheetBackdrop" onclick="closeSheet()"></div>
  <div class="bottom-sheet" id="bottomSheet">
    <div class="sheet-handle"></div>
    <div id="sheetContent"></div>
  </div>

  <script>
    const orders = [
      {
        id: 'ORD-2847', product: 'LED Bulbs 9W', supplier: 'Shenzhen Lighting Co.',
        value: '$3,728', qty: '1,000 pcs', date: 'Nov 15, 2025', dateGroup: 'November 15, 2025',
        eta: 'Dec 1, 2025', status: 'transit', statusLabel: 'In Transit',
        statusSub: 'Shipped from Shenzhen port', stage: 2,
        route: 'Shenzhen → Mumbai', payment: 'LC Confirmed'
      },
      {
        id: 'ORD-2846', product: 'Mobile Chargers', supplier: 'Vietnam Tech Electronics',
        value: '$1,600', qty: '500 pcs', date: 'Nov 12, 2025', dateGroup: 'November 12, 2025',
        eta: 'Nov 25, 2025', status: 'customs', statusLabel: 'At Customs',
        statusSub: 'Awaiting clearance at Mumbai port', stage: 3,
        route: 'Ho Chi Minh → Mumbai', payment: 'T/T Paid'
      },
      {
        id: 'ORD-2845', product: 'Cotton Fabric', supplier: 'Dhaka Textiles Ltd.',
        value: '$4,154', qty: '2,000 meters', date: 'Nov 10, 2025', dateGroup: 'November 10, 2025',
        eta: 'Nov 18, 2025', status: 'delivered', statusLabel: 'Delivered',
        statusSub: 'Received at warehouse', stage: 4,
        route: 'Dhaka → Mumbai', payment: 'T/T Paid'
      },
      {
        id: 'ORD-2844', product: 'Bluetooth Speakers', supplier: 'Guangzhou Audio Tech',
        value: '$5,695', qty: '300 pcs', date: 'Nov 8, 2025', dateGroup: 'November 8, 2025',
        eta: 'Dec 5, 2025', status: 'processing', statusLabel: 'Processing',
        statusSub: 'Order confirmed, awaiting shipment', stage: 1,
        route: 'Guangzhou → Mumbai', payment: 'LC Pending'
      },
      {
        id: 'ORD-2843', product: 'Solar Panels 300W', supplier: 'Taiwan Solar Industries',
        value: '$9,782', qty: '100 pcs', date: 'Nov 5, 2025', dateGroup: 'November 5, 2025',
        eta: 'Dec 12, 2025', status: 'transit', statusLabel: 'In Transit',
        statusSub: 'En route from Kaohsiung', stage: 2,
        route: 'Kaohsiung → Chennai', payment: 'LC Confirmed'
      },
      {
        id: 'ORD-2842', product: 'Power Banks', supplier: 'Shenzhen Power Tech',
        value: '$2,450', qty: '800 pcs', date: 'Nov 3, 2025', dateGroup: 'November 3, 2025',
        eta: 'Nov 14, 2025', status: 'delivered', statusLabel: 'Delivered',
        statusSub: 'Signed by warehouse manager', stage: 4,
        route: 'Shenzhen → Mumbai', payment: 'T/T Paid'
      },
    ];

    const stages = ['Placed', 'Shipped', 'Customs', 'Delivered'];

    let activeFilter = 'all';
    let searchQuery = '';
    let expandedId = null;
    let nextOrderNum = 2848;

    function setFilter(status, chipEl) {
      activeFilter = status;
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      if (chipEl) chipEl.classList.add('active');
      else {
        document.querySelectorAll('.filter-chip').forEach(c => {
          if (c.dataset.status === status) c.classList.add('active');
        });
      }
      syncStatHighlight(status);
      expandedId = null;
      renderTimeline();
    }

    function filterFromStat(filter) {
      setFilter(filter);
    }

    function syncStatHighlight(status) {
      document.querySelectorAll('.stat-card').forEach(s => s.classList.remove('active'));
      if (status === 'all') {
        document.querySelector('.stat-card[data-filter="all"]').classList.add('active');
      } else if (status === 'delivered') {
        document.querySelector('.stat-card[data-filter="delivered"]').classList.add('active');
      } else if (['processing', 'transit', 'customs'].includes(status)) {
        document.querySelector('.stat-card[data-filter="in_progress"]').classList.add('active');
      }
    }

    function onSearch() {
      searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
      document.getElementById('searchClear').classList.toggle('visible', searchQuery.length > 0);
      expandedId = null;
      renderTimeline();
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      searchQuery = '';
      document.getElementById('searchClear').classList.remove('visible');
      renderTimeline();
    }

    function getFilteredOrders() {
      return orders.filter(o => {
        const matchesFilter =
          activeFilter === 'all' ||
          o.status === activeFilter ||
          (activeFilter === 'in_progress' && ['processing', 'transit', 'customs'].includes(o.status));
        const matchesSearch = !searchQuery ||
          o.id.toLowerCase().includes(searchQuery) ||
          o.product.toLowerCase().includes(searchQuery) ||
          o.supplier.toLowerCase().includes(searchQuery);
        return matchesFilter && matchesSearch;
      });
    }

    function updateCounts() {
      const counts = { processing: 0, transit: 0, customs: 0, delivered: 0 };
      orders.forEach(o => counts[o.status]++);
      document.getElementById('countAll').textContent = orders.length;
      document.getElementById('countProcessing').textContent = counts.processing;
      document.getElementById('countTransit').textContent = counts.transit;
      document.getElementById('countCustoms').textContent = counts.customs;
      document.getElementById('countDelivered').textContent = counts.delivered;
    }

    function buildStepperHTML(stage) {
      const checkSvg = '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>';
      const arrowSvg = '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>';

      let html = '';
      stages.forEach((name, i) => {
        const num = i + 1;
        let dotClass = '';
        let labelClass = '';
        let dotContent = num;

        if (num < stage) {
          dotClass = 'done'; labelClass = 'done'; dotContent = checkSvg;
        } else if (num === stage) {
          dotClass = 'active'; labelClass = 'active'; dotContent = arrowSvg;
        }

        html += '<div class="step">' +
          '<div class="step-dot ' + dotClass + '">' + dotContent + '</div>' +
          '<span class="step-label ' + labelClass + '">' + name + '</span>' +
          '</div>';

        if (i < stages.length - 1) {
          let lineClass = '';
          if (num < stage) lineClass = 'done';
          else if (num === stage) lineClass = 'active';
          html += '<div class="step-line ' + lineClass + '"></div>';
        }
      });
      return html;
    }

    function buildDetailHTML(order) {
      return '<div class="detail-status-banner">' +
          '<div class="detail-status-icon">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
              (order.status === 'delivered'
                ? '<polyline points="20 6 9 17 4 12"/>'
                : '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>') +
            '</svg>' +
          '</div>' +
          '<div class="detail-status-text">' +
            '<strong>' + order.statusLabel + '</strong>' +
            '<span>' + order.statusSub + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="detail-extra-grid">' +
          '<div class="detail-extra-item">' +
            '<span class="detail-extra-label">Shipping Route</span>' +
            '<span class="detail-extra-value">' + order.route + '</span>' +
          '</div>' +
          '<div class="detail-extra-item">' +
            '<span class="detail-extra-label">Payment</span>' +
            '<span class="detail-extra-value">' + order.payment + '</span>' +
          '</div>' +
          '<div class="detail-extra-item">' +
            '<span class="detail-extra-label">Quantity</span>' +
            '<span class="detail-extra-value">' + order.qty + '</span>' +
          '</div>' +
          '<div class="detail-extra-item">' +
            '<span class="detail-extra-label">' + (order.status === 'delivered' ? 'Delivered' : 'ETA') + '</span>' +
            '<span class="detail-extra-value">' + order.eta + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="detail-actions">' +
          '<button class="btn btn-ghost">Track Shipment</button>' +
          '<button class="btn btn-primary">View Invoice</button>' +
        '</div>';
    }

    function renderTimeline() {
      const filtered = getFilteredOrders();
      const container = document.getElementById('timelineContainer');

      if (filtered.length === 0) {
        container.innerHTML =
          '<div class="empty-state">' +
            '<div class="empty-state-icon">' +
              '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>' +
            '</div>' +
            '<h4>No orders found</h4>' +
            '<p>' + (searchQuery ? 'No results for "' + searchQuery + '"' : 'No orders match this filter') + '</p>' +
            '<button class="btn btn-ghost" onclick="clearSearch(); setFilter(\'all\');">Clear filters</button>' +
          '</div>';
        return;
      }

      var groups = {};
      filtered.forEach(function(o) {
        if (!groups[o.dateGroup]) groups[o.dateGroup] = [];
        groups[o.dateGroup].push(o);
      });

      var html = '';
      Object.keys(groups).forEach(function(dateLabel) {
        html += '<div class="date-group">' +
          '<div class="date-label">' + dateLabel + '</div>' +
          '<div class="timeline">';

        groups[dateLabel].forEach(function(order) {
          var isExpanded = expandedId === order.id;
          var isDelivered = order.status === 'delivered';
          var etaLabel = isDelivered ? 'Delivered' : 'ETA';
          var badgeClass = isDelivered ? 'delivered' : '';

          html +=
            '<div class="timeline-item">' +
              '<div class="tl-card ' + (isExpanded ? 'expanded' : '') + '" data-status="' + order.status + '" onclick="toggleCard(\'' + order.id + '\')">' +
                '<div class="tl-card-header">' +
                  '<div class="tl-card-header-left">' +
                    '<span class="tl-card-id">' + order.id + '</span>' +
                    '<span class="tl-card-badge ' + badgeClass + '">' + order.statusLabel + '</span>' +
                  '</div>' +
                  '<div class="tl-card-expand-icon">' +
                    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>' +
                  '</div>' +
                '</div>' +
                '<div class="tl-card-body">' +
                  '<div class="tl-card-body-left">' +
                    '<div class="tl-card-product">' + order.product + '</div>' +
                    '<div class="tl-card-supplier">' + order.supplier + ' &middot; ' + order.qty + '</div>' +
                    '<div class="tl-card-mobile-meta">' + order.eta + ' &middot; ' + order.route + '</div>' +
                  '</div>' +
                  '<div class="tl-card-mobile-value">' + order.value + '</div>' +
                '</div>' +
                /* Desktop: stepper + full meta grid */
                '<div class="progress-stepper">' +
                  buildStepperHTML(order.stage) +
                '</div>' +
                '<div class="tl-card-meta">' +
                  '<div class="tl-meta-item">' +
                    '<span class="tl-meta-label">Value</span>' +
                    '<span class="tl-meta-value highlight">' + order.value + '</span>' +
                  '</div>' +
                  '<div class="tl-meta-item">' +
                    '<span class="tl-meta-label">Ordered</span>' +
                    '<span class="tl-meta-value">' + order.date + '</span>' +
                  '</div>' +
                  '<div class="tl-meta-item">' +
                    '<span class="tl-meta-label">' + etaLabel + '</span>' +
                    '<span class="tl-meta-value">' + order.eta + '</span>' +
                  '</div>' +
                  '<div class="tl-meta-item">' +
                    '<span class="tl-meta-label">Route</span>' +
                    '<span class="tl-meta-value">' + order.route + '</span>' +
                  '</div>' +
                '</div>' +
                '<div class="tl-card-details">' +
                  buildDetailHTML(order) +
                '</div>' +
              '</div>' +
            '</div>';
        });

        html += '</div></div>';
      });

      container.innerHTML = html;
    }

    function toggleCard(orderId) {
      if (window.innerWidth <= 768) {
        var order = orders.find(function(o) { return o.id === orderId; });
        if (order) openSheet(order);
        return;
      }
      expandedId = expandedId === orderId ? null : orderId;
      renderTimeline();
    }

    function openSheet(order) {
      document.getElementById('sheetContent').innerHTML =
        '<div style="margin-bottom: 16px;">' +
          '<div style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px;">' +
            '<span class="tl-card-id" style="font-size: 0.8rem;">' + order.id + '</span>' +
            '<span class="tl-card-badge ' + (order.status === 'delivered' ? 'delivered' : '') + '" style="font-size: 0.68rem; padding: 3px 8px;">' + order.statusLabel + '</span>' +
          '</div>' +
          '<div style="font-size: 1rem; font-weight: 500; margin-bottom: 4px; color: var(--text-primary);">' + order.product + '</div>' +
          '<div style="font-size: 0.82rem; color: var(--text-secondary);">' + order.supplier + ' &middot; ' + order.qty + '</div>' +
        '</div>' +
        '<div class="progress-stepper" style="margin-bottom: 16px; padding: 10px 12px;">' +
          buildStepperHTML(order.stage) +
        '</div>' +
        buildDetailHTML(order);

      document.getElementById('sheetBackdrop').classList.add('open');
      document.getElementById('bottomSheet').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeSheet() {
      document.getElementById('sheetBackdrop').classList.remove('open');
      document.getElementById('bottomSheet').classList.remove('open');
      document.body.style.overflow = '';
    }

    function openModal() {
      document.getElementById('modalBackdrop').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal(e) {
      if (e && e.target !== document.getElementById('modalBackdrop')) return;
      document.getElementById('modalBackdrop').classList.remove('open');
      document.body.style.overflow = '';
    }

    function createOrder() {
      var product = document.getElementById('formProduct').value.trim() || 'New Product';
      var supplier = document.getElementById('formSupplier').value.trim() || 'New Supplier';
      var qty = document.getElementById('formQty').value.trim() || '100 pcs';
      var value = document.getElementById('formValue').value.trim() || '$1,000';
      var dateInput = document.getElementById('formDate').value;

      var today = new Date();
      var monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      var shortMonths = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

      var dateStr = shortMonths[today.getMonth()] + ' ' + today.getDate() + ', ' + today.getFullYear();
      var dateGroupStr = monthNames[today.getMonth()] + ' ' + today.getDate() + ', ' + today.getFullYear();

      var eta = dateStr;
      if (dateInput) {
        var d = new Date(dateInput);
        eta = shortMonths[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
      }

      var newOrder = {
        id: 'ORD-' + nextOrderNum++,
        product: product, supplier: supplier, value: value, qty: qty,
        date: dateStr, dateGroup: dateGroupStr, eta: eta,
        status: 'processing', statusLabel: 'Processing',
        statusSub: 'Order confirmed, awaiting shipment',
        stage: 1, route: 'TBD', payment: 'Pending'
      };

      orders.unshift(newOrder);
      updateCounts();

      ['formProduct','formSupplier','formQty','formValue','formDate'].forEach(function(id) {
        document.getElementById(id).value = '';
      });

      closeModal();
      setFilter('all');
      showToast('Order ' + newOrder.id + ' created');
    }

    function showToast(msg) {
      var toast = document.getElementById('toast');
      document.getElementById('toastText').textContent = msg;
      toast.classList.add('visible');
      setTimeout(function() { toast.classList.remove('visible'); }, 3000);
    }

    updateCounts();
    renderTimeline();

  </script>
</body>
</html>
